<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =========================================
         APPLY SAVED THEME BEFORE REACT LOADS
         ========================================= -->

    <script>
      const savedTheme =
        localStorage.getItem("spendnest_appearance");

      if (savedTheme === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>

    <title>SpendNest</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
